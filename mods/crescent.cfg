// Crescent autoconfig. (The first line of this file must be a comment.)
//
// Runs once at every browser startup, before any window opens. It:
//   1. Turns off every AI / machine-learning feature (locked, can't be re-enabled in Settings).
//   2. Sets Arc-like defaults (you can still change these in Settings or about:config).
//   3. Loads crescent/crescent.css to make the UI look more like Arc.
//   4. Adds Arc-style "auto-archive": unpinned tabs you haven't looked at in 12 hours get closed.
//      They stay in History > Recently Closed Tabs, like Arc's Archive.

// ---------------------------------------------------------------------------
// 1. No AI. lockPref = forced and greyed out.
// ---------------------------------------------------------------------------
lockPref("browser.ai.control.default", "blocked");
lockPref("browser.ml.enable", false);
lockPref("browser.ml.chat.enabled", false);
lockPref("browser.ml.chat.sidebar", false);
lockPref("browser.ml.chat.menu", false);
lockPref("browser.ml.chat.page", false);
lockPref("browser.ml.chat.shortcuts", false);
lockPref("browser.ml.chat.shortcuts.custom", false);
lockPref("browser.ml.chat.shortcuts.smartwindow", false);
lockPref("browser.ml.linkPreview.enabled", false);
lockPref("browser.ml.pageAssist.enabled", false);
lockPref("browser.tabs.groups.smart.enabled", false);   // AI tab grouping / "clean up" suggestions
lockPref("browser.tabs.groups.smart.userEnabled", false);
lockPref("browser.smartwindow.enabled", false);         // AI "Smart Window"
lockPref("browser.smartwindow.autoTabGrouping.enabled", false);
lockPref("browser.smartwindow.autoTabGrouping.preloadModels", false);
lockPref("browser.smartwindow.smartformfill.enabled", false);
lockPref("browser.smartwindow.memories.generateFromHistory", false);
lockPref("browser.smartwindow.memories.generateFromConversation", false);
lockPref("extensions.ml.enabled", false);               // lets extensions run AI models
lockPref("pdfjs.enableAltText", false);                 // AI image descriptions in PDFs
lockPref("places.semanticHistory.featureGate", false);  // AI history search
lockPref("browser.urlbar.quicksuggest.mlEnabled", false);
lockPref("browser.search.visualSearch.featureGate", false);
// Page translation runs an on-device AI model, so it's off too.
// To turn it back on, delete the next line AND the "AIControls" block in distribution/policies.json.
lockPref("browser.translations.enable", false);

// Telemetry / studies off
lockPref("datareporting.healthreport.uploadEnabled", false);
lockPref("toolkit.telemetry.enabled", false);
lockPref("app.shield.optoutstudies.enabled", false);
lockPref("browser.discovery.enabled", false);

// ---------------------------------------------------------------------------
// 2. Arc-like defaults (defaultPref = just the default; you can still change them)
// ---------------------------------------------------------------------------
defaultPref("zen.tabs.vertical", true);
defaultPref("zen.tabs.vertical.right-side", false);
defaultPref("zen.view.use-single-toolbar", true);        // no top toolbar; address lives in the sidebar
defaultPref("zen.view.sidebar-expanded", true);
defaultPref("zen.view.hide-window-controls", false);     // traffic lights always visible, top of sidebar
defaultPref("zen.urlbar.replace-newtab", true);          // Cmd+T opens the command bar, like Arc
defaultPref("zen.urlbar.behavior", "floating-on-type");
defaultPref("zen.urlbar.show-domain-only-in-sidebar", true);
defaultPref("zen.urlbar.single-toolbar-show-copy-url", true);
defaultPref("zen.workspaces.separate-essentials", false); // Favorites shared across all Spaces, like Arc
defaultPref("zen.glance.enabled", true);                  // "Peek"
defaultPref("zen.glance.activation-method", "shift");     // Shift+click a link = Peek, like Arc
defaultPref("zen.glance.open-essential-external-links", true);
defaultPref("zen.boosts.enabled", true);                  // Arc-style Boosts
defaultPref("zen.mediacontrols.enabled", true);           // media controls in the sidebar
defaultPref("zen.view.compact.hide-tabbar", true);        // Cmd+S hides the sidebar
defaultPref("zen.view.compact.show-sidebar-and-toolbar-on-hover", true);
defaultPref("zen.view.show-clear-tabs-button", true);     // "Clear" button above Today tabs
defaultPref("zen.tabs.select-recently-used-on-close", true);
defaultPref("browser.toolbars.bookmarks.visibility", "never"); // Arc has no bookmarks bar
defaultPref("browser.sessionstore.max_tabs_undo", 100);   // a bigger "Archive"
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("browser.newtabpage.activity-stream.feeds.section.topstories", false);

// Auto-archive settings (change in about:config). 0 hours = off.
defaultPref("crescent.archive.after-hours", 12);
defaultPref("crescent.archive.check-minutes", 10);

// ---------------------------------------------------------------------------
// 3 + 4. Stylesheet and auto-archive
// ---------------------------------------------------------------------------
try {
  (function () {
    const Cc = Components.classes;
    const Ci = Components.interfaces;
    const prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefBranch);
    const obs = Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService);
    const io = Cc["@mozilla.org/network/io-service;1"].getService(Ci.nsIIOService);
    const dirsvc = Cc["@mozilla.org/file/directory_service;1"].getService(Ci.nsIProperties);
    const env = Cc["@mozilla.org/process/environment;1"].getService(Ci.nsIEnvironment);

    const report = { cssRegistered: false, archiveWindows: 0, errors: [] };
    const logError = (where, e) => {
      report.errors.push(where + ": " + e);
      Components.utils.reportError("Crescent " + where + ": " + e);
    };

    // --- 3. Arc look: register crescent.css from inside the app bundle ---
    try {
      const css = dirsvc.get("GreD", Ci.nsIFile); // .app/Contents/Resources
      css.append("crescent");
      css.append("crescent.css");
      if (css.exists()) {
        const sss = Cc["@mozilla.org/content/style-sheet-service;1"].getService(Ci.nsIStyleSheetService);
        const uri = io.newFileURI(css);
        if (!sss.sheetRegistered(uri, sss.USER_SHEET)) {
          sss.loadAndRegisterSheet(uri, sss.USER_SHEET);
        }
        report.cssRegistered = true;
      } else {
        logError("css", "missing " + css.path);
      }
    } catch (e) {
      logError("css", e);
    }

    // --- 4. Auto-archive ---
    function archiveOldTabs(win) {
      const hours = prefs.getIntPref("crescent.archive.after-hours", 12);
      if (hours <= 0 || !win.gBrowser) {
        return;
      }
      const cutoff = Date.now() - hours * 3600 * 1000;
      const old = win.gBrowser.tabs.filter(
        t =>
          !t.pinned && // pinned tabs + folders (Arc's "Pinned")
          !t.hasAttribute("zen-essential") && // Essentials (Arc's "Favorites")
          !t.hasAttribute("zen-glance-tab") && // open Peek
          !t.hasAttribute("zen-empty-tab") &&
          !t.splitView &&
          !t.selected &&
          !t.multiselected &&
          !t.soundPlaying &&
          t.lastAccessed > 0 &&
          t.lastAccessed < cutoff
      );
      if (old.length) {
        win.gBrowser.removeTabs(old, { animate: false });
      }
    }

    function setUpWindow(win) {
      try {
        if (win.__crescentReady || !win.gBrowser) {
          return;
        }
        win.__crescentReady = true;
        report.archiveWindows++;
        const run = () => {
          try {
            archiveOldTabs(win);
          } catch (e) {
            logError("archive", e);
          }
        };
        const minutes = Math.max(1, prefs.getIntPref("crescent.archive.check-minutes", 10));
        win.setTimeout(run, 60 * 1000);
        win.setInterval(run, minutes * 60 * 1000);
      } catch (e) {
        logError("window", e);
      }
    }

    // Optional self-test, only used by the build check (CRESCENT_SELFTEST=/some/folder).
    async function selfTest(win, dir) {
      await new Promise(r => win.setTimeout(r, 12000));
      const P = win.Services.prefs;
      report.policies = {
        status: win.Services.policies.status,
        active: Object.keys(win.Services.policies.getActivePolicies() || {}),
      };
      report.prefs = {};
      for (const p of [
        "browser.ml.enable",
        "browser.ml.chat.enabled",
        "browser.tabs.groups.smart.enabled",
        "browser.smartwindow.enabled",
        "browser.ai.control.default",
        "zen.urlbar.replace-newtab",
        "zen.view.hide-window-controls",
        "crescent.archive.after-hours",
      ]) {
        try {
          const t = P.getPrefType(p);
          report.prefs[p] =
            t == P.PREF_BOOL ? P.getBoolPref(p) : t == P.PREF_INT ? P.getIntPref(p) : P.getStringPref(p, "");
          report.prefs[p + " (locked)"] = P.prefIsLocked(p);
        } catch (e) {
          report.prefs[p] = "error " + e;
        }
      }
      report.tabs = win.gBrowser.tabs.length;
      try {
        const bmp = await win.browsingContext.currentWindowGlobal.drawSnapshot(null, 1, "white");
        const c = win.document.createElementNS("http://www.w3.org/1999/xhtml", "canvas");
        c.width = bmp.width;
        c.height = bmp.height;
        c.getContext("2d").drawImage(bmp, 0, 0);
        const blob = await new Promise(r => c.toBlob(r, "image/png"));
        await win.IOUtils.write(win.PathUtils.join(dir, "window.png"), new Uint8Array(await blob.arrayBuffer()));
        report.snapshot = true;
      } catch (e) {
        report.snapshot = "failed: " + e;
      }
      await win.IOUtils.writeUTF8(win.PathUtils.join(dir, "selftest.json"), JSON.stringify(report, null, 2));
    }

    const selfTestDir = env.exists("CRESCENT_SELFTEST") ? env.get("CRESCENT_SELFTEST") : "";
    let selfTestStarted = false;

    obs.addObserver(
      {
        observe(win) {
          setUpWindow(win);
          if (selfTestDir && !selfTestStarted) {
            selfTestStarted = true;
            selfTest(win, selfTestDir).catch(e => logError("selftest", e));
          }
        },
      },
      "browser-delayed-startup-finished"
    );
  })();
} catch (e) {
  Components.utils.reportError("Crescent autoconfig failed: " + e);
}
