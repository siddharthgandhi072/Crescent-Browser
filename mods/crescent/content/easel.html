<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Easel</title>
  <link rel="icon" href="chrome://crescent/content/icons/easel.svg">
  <link rel="stylesheet" href="chrome://crescent/content/pages.css">
  <link rel="stylesheet" href="chrome://crescent/content/easel.css">
</head>
<body>
  <header id="top">
    <button id="back" class="ghost" title="All Easels">‹ Easels</button>
    <input id="title" type="text" spellcheck="false" placeholder="Untitled Easel">
    <span class="spacer"></span>
    <span id="saved" class="muted">Saved</span>
    <button id="delete" class="ghost danger" title="Delete this Easel">Delete</button>
  </header>
  <div id="viewport"><div id="board"><svg id="ink"></svg></div></div>

  <div id="tools">
    <button data-tool="select" title="Select (V)">↖</button>
    <button data-tool="text" title="Text (T)"><b>T</b></button>
    <button data-tool="note" title="Sticky note (N)">▤</button>
    <button data-tool="draw" title="Draw (P)">✎</button>
    <button data-tool="rect" title="Rectangle (R)">▭</button>
    <button data-tool="ellipse" title="Ellipse (O)">◯</button>
    <span class="sep"></span>
    <button id="image" title="Add image">🖼</button>
    <button id="link" title="Add link (L)">🔗</button>
    <button id="capture" class="capture" title="Capture part of a tab (C)">Capture</button>
    <span class="sep" id="colorsep"></span>
    <span id="colors"></span>
  </div>

  <input id="file" type="file" accept="image/*" hidden>

  <div id="modal" hidden>
    <div class="sheet">
      <div class="row"><h2 id="modal-title">Capture from a tab</h2><span class="spacer"></span><button id="modal-close" class="ghost">Cancel</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
  <script src="chrome://crescent/content/easel.js"></script>
</body>
</html>
