<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Easels</title>
  <link rel="icon" href="chrome://crescent/content/icons/easel.svg">
  <link rel="stylesheet" href="chrome://crescent/content/pages.css">
  <style>
    .head { margin-bottom: 22px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
    .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); cursor: pointer;
            overflow: hidden; transition: transform .12s ease, box-shadow .12s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 2px 4px rgba(0,0,0,.06), 0 10px 28px rgba(0,0,0,.10); }
    .preview { position: relative; height: 140px; overflow: hidden;
               background: radial-gradient(circle, var(--line) 1px, transparent 1.2px) 0 0 / 14px 14px, light-dark(#faf9fc, #232228); }
    .preview i { position: absolute; border-radius: 3px; }
    .info { padding: 10px 14px 12px; }
    .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .when { font-size: 12px; color: var(--muted); }
    .new { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px;
           min-height: 196px; border: 1.5px dashed var(--line); background: transparent; box-shadow: none; color: var(--muted); }
    .new b { font-size: 28px; font-weight: 300; color: var(--accent); }
  </style>
</head>
<body>
  <div class="page">
    <div class="row head">
      <h1>Easels</h1>
      <span class="spacer"></span>
      <button id="new" class="primary">New Easel</button>
    </div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="chrome://crescent/content/easels.js"></script>
</body>
</html>
