<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Can’t open this page</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body { display: grid; place-items: center; height: 100vh; background: #fbf9fc; color: #2f2836; user-select: text; -webkit-user-select: text; }
  @media (prefers-color-scheme: dark) { body { background: #1d1b21; color: #efe8f4; } p, .code { color: rgba(239,232,244,.6) !important; } button.sec { background: rgba(255,255,255,.08) !important; } }
  main { max-width: 460px; padding: 32px; }
  .moon { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; background: linear-gradient(135deg,#d9c6ef,#f3cfb4); margin-bottom: 22px; }
  .moon svg { width: 22px; height: 22px; fill: none; stroke: #3a2c4a; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 40px; line-height: 1.05; letter-spacing: -.01em; margin-bottom: 12px; }
  p { color: #6e6476; font-size: 14.5px; line-height: 1.55; }
  .code { font-size: 12px; color: #9b92a3; margin-top: 14px; font-family: ui-monospace, monospace; word-break: break-all; }
  .btns { display: flex; gap: 8px; margin-top: 24px; }
  button { height: 38px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; background: #2f2836; color: #fff; }
  button.sec { background: #efe9f3; color: inherit; }
</style>
</head>
<body>
<main>
  <div class="moon"><svg viewBox="0 0 24 24"><path d="M19 14.5A7.5 7.5 0 0 1 9.5 5a7.5 7.5 0 1 0 9.5 9.5z"/></svg></div>
  <h1 id="t">This page didn’t load</h1>
  <p id="d"></p>
  <div class="code" id="c"></div>
  <div class="btns"><button id="retry">Try again</button><button class="sec" id="back">Go back</button></div>
</main>
<script src="error.js"></script>
</body>
</html>
