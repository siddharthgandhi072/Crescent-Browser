<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Not right now</title>
<link rel="stylesheet" href="../shared/base.css">
<style>
  body { display: grid; place-items: center; height: 100vh; background: #f7f4f0; color: #2a2520; }
  @media (prefers-color-scheme: dark) { body { background: #1c1a20; color: #ece6f1; } p, .site { color: rgba(236,230,241,.55) !important; } button { background: #ece6f1 !important; color: #1c1a20 !important; } }
  main { max-width: 440px; padding: 32px; text-align: center; }
  .t { font: 600 13px var(--font); letter-spacing: .08em; text-transform: uppercase; color: #a08f7a; margin-bottom: 18px; font-variant-numeric: tabular-nums; }
  h1 { font-family: var(--serif); font-weight: 400; font-size: 44px; line-height: 1.05; margin-bottom: 14px; }
  p { color: #75695c; font-size: 14.5px; line-height: 1.55; }
  .site { font-size: 12.5px; color: #a08f7a; margin-top: 10px; word-break: break-all; }
  button { margin-top: 26px; height: 38px; padding: 0 18px; border-radius: 10px; font-weight: 600; font-size: 13.5px; background: #2a2520; color: #fff; }
</style>
</head>
<body>
<main>
  <div class="t" id="left"></div>
  <h1>Not right now.</h1>
  <p>You’re in a focus session. This site isn’t on your list, so it’ll be here when you’re done.</p>
  <div class="site" id="site"></div>
  <button id="back">Go back</button>
</main>
<script src="blocked.js"></script>
</body>
</html>
