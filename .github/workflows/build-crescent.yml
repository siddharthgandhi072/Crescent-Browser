name: Build Crescent (Arc-style Zen) for macOS

on:
  workflow_dispatch:
    inputs:
      zen_version:
        description: "Zen release tag to build from (or 'latest')"
        default: latest
  push:
    branches-ignore:
      - ci-screenshots

permissions:
  contents: write # only used to save the self-test screenshots to the ci-screenshots branch

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Build the DMG
        env:
          ZEN_VERSION: ${{ github.event.inputs.zen_version || 'latest' }}
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Self-test (launch Crescent, try every feature, take screenshots)
        run: |
          APP="build/dmg/Crescent.app"
          OUT="$PWD/selftest"; PROFILE="$RUNNER_TEMP/profile"
          mkdir -p "$OUT" "$PROFILE"
          echo 'user_pref("zen.welcome-screen.seen", true);' > "$PROFILE/user.js"
          CRESCENT_SELFTEST="$OUT" "$APP/Contents/MacOS/zen" -profile "$PROFILE" -no-remote > "$OUT/stdout.log" 2>&1 &
          PID=$!
          for i in $(seq 1 120); do [ -f "$OUT/selftest.json" ] && break; sleep 2; done
          screencapture -x "$OUT/7-screen.png" || true
          kill $PID || true
          cat "$OUT/selftest.json" || { echo "Self-test did not report"; tail -80 "$OUT/stdout.log"; }

      - name: Save screenshots to the ci-screenshots branch
        if: always()
        run: |
          [ -d selftest ] || exit 0
          mkdir -p "$RUNNER_TEMP/shots" && cp selftest/* "$RUNNER_TEMP/shots/" 2>/dev/null || true
          cd "$RUNNER_TEMP/shots"
          git init -q && git checkout -q -b ci-screenshots
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Self-test screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Check the self-test results
        run: |
          python3 - selftest/selftest.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1]))
          checks = {
            "Crescent look loaded": r.get("cssRegistered"),
            "AI blocked by policy": "AIControls" in r["policies"]["active"],
            "AI prefs off": r["prefs"]["browser.ml.enable"] is False and r["prefs"]["browser.ml.chat.enabled"] is False,
            "Menus say Crescent": "Crescent" in r["brand"]["quit"],
            "Sidebar buttons added": r.get("sidebarButtons"),
            "File menu items added": r.get("menuItems"),
            "Closed tab archived": (r.get("archiveCount") or 0) >= 1,
            "Settings window opens": r.get("settingsOpened"),
            "Little Crescent opens": r.get("littleOpened"),
            "Little Crescent bar": r.get("littleBar"),
            "Open in Crescent works": r.get("littlePromoted"),
            "No errors": not r.get("errors"),
          }
          for name, ok in checks.items():
              print(("PASS " if ok else "FAIL ") + name)
          if not all(checks.values()):
              print("errors:", r.get("errors"))
              sys.exit(1)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: Crescent-dmg
          path: dist/Crescent.dmg
          compression-level: 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest
