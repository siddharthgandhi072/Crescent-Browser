name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release with the .dmg files'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb imagemagick
      - name: End-to-end tests (real app)
        run: xvfb-run -a -s "-screen 0 1440x900x24" node test/e2e/run.js
        env:
          SHOTS: ${{ runner.temp }}/shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  mac:
    name: macOS .dmg
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build .dmg (Apple Silicon + Intel)
        env:
          # Optional: add these repository secrets to sign + notarize, so the
          # app opens without any Gatekeeper warning.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Signing with Developer ID and notarizing"
            npx electron-builder --mac --publish never -c.mac.notarize=true
          else
            echo "No signing certificate: ad-hoc signing (right-click → Open on first launch)"
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            npx electron-builder --mac --publish never -c.mac.identity=-
          fi
      - name: Verify the app bundle
        run: |
          APP=$(ls -d dist/mac-arm64/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          plutil -p "$APP/Contents/Info.plist" | grep -E "CFBundleURLSchemes|http" | head
      - uses: actions/upload-artifact@v4
        with:
          name: Crescent-dmg
          path: dist/*.dmg
          if-no-files-found: error
      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Crescent ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*.dmg
          body: |
            **Download:** `Crescent-${{ steps.v.outputs.version }}-arm64.dmg` for Apple Silicon (M1–M4), `-x64.dmg` for Intel Macs.

            Drag Crescent to Applications. If macOS says it can’t verify the app, open **System Settings → Privacy & Security** and click **Open Anyway** (only needed once).
